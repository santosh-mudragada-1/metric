<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metric — Daily Puzzles</title>
    <meta name="description" content="Five short logic puzzles. A new set every day, same board for everyone." />
    <meta property="og:title" content="Metric — Daily Puzzles" />
    <meta property="og:description" content="Five short logic puzzles. A new set every day, same board for everyone." />
    <meta property="og:image" content="/og-daily.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Metric — Daily Puzzles" />
    <meta name="twitter:description" content="Five short logic puzzles. A new set every day, same board for everyone." />
    <meta name="twitter:image" content="/og-daily.png" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('metric:v1:theme')
          var theme = raw ? JSON.parse(raw) : null
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght@6..144,75..100,100..1000&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
