<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metric</title>
    <meta name="description" content="Test your reflexes and memory. Play solo or challenge friends in real time." />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('metric:v1:theme')
          var theme = raw ? JSON.parse(raw) : null
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght@6..144,75..100,100..1000&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
